name: Daily travel hub updates
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: daily-updates
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Daily travel hub updates
        env:
          UPDATE_TRIGGER: ${{ github.event_name }}
          UPDATE_JOB_URL: https://almaty-travel-guide.vercel.app/api/jobs/daily
        run: |
          node --input-type=module <<'JS'
          const url = process.env.UPDATE_JOB_URL;
          const tokenResponse = await fetch(process.env.ACTIONS_ID_TOKEN_REQUEST_URL + '&audience=' + encodeURIComponent(url), {
            headers: {Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}`}
          });
          if (!tokenResponse.ok) throw new Error('Unable to obtain scheduler identity');
          const {value} = await tokenResponse.json();
          for (let attempt = 0; attempt < 6; attempt++) {
            const response = await fetch(url, {method: 'POST', headers: {Authorization: `Bearer ${value}`, 'X-Scheduler': 'github-actions', 'X-Update-Trigger': process.env.UPDATE_TRIGGER}, signal: AbortSignal.timeout(65000)});
            const body = await response.json();
            if (body.busy && attempt < 5) {
              console.log('Another update is running; retrying in ten seconds.');
              await new Promise(resolve => setTimeout(resolve, 10000));
              continue;
            }
            if (!response.ok) throw new Error(`Update returned HTTP ${response.status}`);
            console.log(JSON.stringify(body));
            break;
          }
          JS
