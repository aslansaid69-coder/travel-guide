name: Camera health checks
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: camera-health
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check direct camera streams
        env:
          CAMERA_JOB_URL: https://almaty-travel-guide.vercel.app/api/jobs/cameras
        run: |
          node --input-type=module <<'JS'
          const url = process.env.CAMERA_JOB_URL;
          const tokenResponse = await fetch(process.env.ACTIONS_ID_TOKEN_REQUEST_URL + '&audience=' + encodeURIComponent(url), {
            headers: {Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}`}
          });
          if (!tokenResponse.ok) throw new Error('Unable to obtain scheduler identity');
          const {value} = await tokenResponse.json();
          const response = await fetch(url, {method: 'POST', headers: {Authorization: `Bearer ${value}`, 'X-Scheduler': 'github-actions'}, signal: AbortSignal.timeout(65000)});
          const body = await response.text();
          if (!response.ok) throw new Error(`Camera monitor returned HTTP ${response.status}`);
          console.log(body);
          JS
